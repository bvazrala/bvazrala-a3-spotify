<h1>Search Spotify</h1>
<!--input's model is bound to searchString; pressing enter also searches-->
<input [(ngModel)]="searchString" (keyup.enter)="search()">
<!--select's model is bound to searchCategory; changing the category re-runs the search-->
<select [(ngModel)]="searchCategory" (ngModelChange)="search()">
	<!--loop over searchCategories to create dropdown options-->
	@for(category of searchCategories; track category) {
		<option [value]="category">{{category}}</option>
	}
</select>
<!--Call search function when the button is clicked-->
<button class="btn btn-light" (click)="search()">Search</button>
@if(resources) {
	@if(resultCategory == 'track') {
		<!--Tracks are shown in a track-list-->
		<app-track-list [tracks]="tracks"></app-track-list>
	} @else {
		<!--Artists and albums are shown in a carousel-->
		<app-carousel carouselId="searchCarousel" [resources]="resources"></app-carousel>
	}
}
