<!--href is bound to the local URL for the album/artist/song.-->
<a [href]="localUrl">
	<!--src is bound to the album/artist/song image URL-->
	<img class="d-block w-100" [src]="resource.imageURL" [alt]="resource.name">
	<div class="carousel-caption d-none d-md-block">
		<!--h5 shows the album/artist/song name-->
		<h5>{{resource.name}}</h5>
	</div>
	</a>
