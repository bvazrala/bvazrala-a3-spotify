@if(popularity) {
<div class="progress">
	<!--background-color comes from the level of popularity and width from the popularity's percent. The percent is displayed as text.-->
  <div class="progress-bar" role="progressbar" [style.width]="popularity.percentageString" [style.background-color]="popularity.color"
  	[attr.aria-valuenow]="popularity.percent * 100" aria-valuemin="0" aria-valuemax="100">
  	<span class="progress-bar-text">{{label}}: {{popularity.percentageString}}</span>
  </div>
</div>
}
