@if(artist) {
	<div class="row">
		<div class="col-xl-4 col-12">
			<!--artist name-->
			<h1>{{artist.name}}</h1>
			<!--artist image URL (max-width keeps large images from spilling out of their column)-->
			<img id="artistImg" [src]="artist.imageURL" [alt]="artist.name" style="max-width: 100%;">
			<p>
				<!--link to artist page on spotify, display artist name-->
				<a class="btn btn-light" role="button" target="_blank" [href]="artist.url">Open {{artist.name}} on Spotify</a>
			</p>
		</div>
		<div class="col-xl-4 col-12">
			<h3>Popularity</h3>
			<!--the number of followers, formatted with commas for thousands/millions-->
			@if(artist.followers != undefined) {
				<p>{{artist.followersStr}} followers</p>
			}
			<app-thermometer [popularity]="artist.popularity"></app-thermometer>
			<h3>{{artist.name}}'s Albums</h3>
			<!--A carousel of the artist's albums-->
			<app-carousel carouselId="artistAlbumsCarousel" [resources]="albums"></app-carousel>
		</div>
		<div class="col-xl-4 col-12">
			<h3>{{artist.name}}'s Top Tracks</h3>
			<!--the artist's top tracks-->
			<app-track-list [tracks]="topTracks"></app-track-list>
		</div>
	</div>
}
